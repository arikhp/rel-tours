name = "rel-tours-api"
main = "src/index.js"
compatibility_date = "2026-09-15"
account_id = "c0a159fff33f3b56b1b71eb1dc4f739c"

[dev]
port = 8787

# Runtime secrets (TRAVELPAYOUTS_TOKEN, TP_MARKER, SERPAPI_KEY, ...) are set with
# `wrangler secret put <NAME>` — never listed here and never committed. For local
# development, copy api/.dev.vars.example to api/.dev.vars (gitignored) and fill
# in real values.

# Fare cache KV namespace, provisioned in REL-8. Nothing reads/writes it yet —
# that's wired up in REL-15. Rate-limiter namespaces still land in REL-22/REL-31.
[[kv_namespaces]]
binding = "FARE_CACHE"
id = "b88fdabeca174a34bfe0b0fc01edc4ff"
