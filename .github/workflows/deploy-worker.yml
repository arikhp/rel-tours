name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "api/**"
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy rel-tours-api to Cloudflare Workers
    steps:
      - uses: actions/checkout@v5

      # api/ doesn't have a repo-wide .nvmrc/engines pin yet (that lands with
      # REL-7's CI workflow) — 22 matches the version REL-7 pins elsewhere, so
      # this can switch to `node-version-file: .nvmrc` once that's merged.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies (api/)
        working-directory: api
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: api
